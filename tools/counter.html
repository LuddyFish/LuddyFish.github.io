<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Jack Luttrell">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Jack Luttrell</title>
        <link rel="icon" href="images/pixel-art/jack-of-clubs.png" type="image/x-icon">
        <link rel="stylesheet" href="../styles/counter.css"> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/ed4e6815d0.js" crossorigin="anonymous"></script> 
        <script src="../js/counter.js" defer></script>
        <script src="../js/fontawesome.js" defer></script>
        <link rel="stylesheet" href="">
    </head>
    <body class="bg-body-secondary">
        <main>
            <div class="card bg-white m-2 mobile-card mx-auto">
                <div class="d-flex justify-content-between">
                    <button id="return" class="btn fs-3" onclick="goToHome()"><i class="fa-solid fa-circle-arrow-left"></i></button>
                    <button id="reset" class="btn fs-3" onclick="reset(), addSpin(this, true, 750)"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                </div>
                <div class="d-block text-center">
                    <div id="counter" class="counter">100</div>
                </div>
                <div class="row justify-content-center mb-4 mb-sm-3">
                    <div class="col-5 col-sm-3 text-center">
                        <button id="decrement" class="btn btn-outline-danger px-5 px-sm-4 py-3 py-sm-2 fs-4" onclick="decrement()"><i class="fa-solid fa-minus"></i></button>
                    </div>
                    <div class="col-5 col-sm-3 text-center">
                        <button id="increment" class="btn btn-outline-primary px-5 px-sm-4 py-3 py-sm-2 fs-4" onclick="increment()"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
                <div class="row justify-content-center gap-2">
                    <div class="empty d-none d-sm-block col-sm-1"></div>
                    <label for="setCount" class="col-3 col-sm-2 text-end align-self-center">Count:</label>
                    <input type="number" name="setCount" id="setCount" class="col-3 col-sm-2">
                    <button id="manualCountSetter" class="col-2 col-sm-1 btn btn-outline-secondary" onclick="setCountManually()" disabled><i class="fa-solid fa-check"></i></button>
                    <div class="empty col-1 col-sm-2"></div>
                </form>
            </div>
        </main>
    </body>
</html>
